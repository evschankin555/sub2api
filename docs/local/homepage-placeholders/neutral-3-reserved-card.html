<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Unavailable</title>
  <style>
    :root{--bg:#e9eef1;--ink:#18242d;--muted:#6d7a84;--line:#ccd7de;--blue:#2b6df6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f9fbfc,#dfe8ed);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(680px,100%);padding:18px;border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:0 26px 80px rgba(24,36,45,.14)}.inner{min-height:430px;border:1px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(26px,6vw,54px)}.top{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.14em}.mark{width:18px;height:18px;background:var(--blue);border-radius:6px;box-shadow:18px 0 0 #93c5fd,36px 0 0 #bfdbfe}h1{margin:70px 0 14px;font-size:clamp(44px,9vw,86px);line-height:.88;letter-spacing:-.08em}p{margin:0;max-width:420px;color:var(--muted);font-size:16px;line-height:1.65}.bottom{display:flex;justify-content:space-between;align-items:end;color:var(--muted);font-size:12px}.num{font-size:72px;line-height:.8;color:#d5dee5;font-weight:800}@media(max-width:620px){.bottom{margin-top:60px}.num{font-size:48px}}
  </style>
</head>
<body><main class="card"><div class="inner"><div class="top"><span>reserved space</span><span class="mark"></span></div><section><h1>No public page.</h1><p>The requested address is intentionally not configured for public content.</p></section><div class="bottom"><span>noindex · nofollow</span><span class="num">00</span></div></div></main></body>
</html>
