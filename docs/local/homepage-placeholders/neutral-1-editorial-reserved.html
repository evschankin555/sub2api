<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reserved</title>
  <style>
    :root { --bg:#f6f2ea; --ink:#1f252b; --muted:#85817a; --line:#ded7ca; --accent:#c96f4a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px; color:var(--ink); background: radial-gradient(circle at 80% 20%, #fff7d6, transparent 30rem), linear-gradient(135deg, #f8f4ec, var(--bg)); font-family: Georgia, "Times New Roman", serif; }
    main { width:min(720px,100%); padding:clamp(32px,8vw,76px); border:1px solid var(--line); border-radius:34px; background:rgba(255,255,255,.42); box-shadow:0 30px 90px rgba(54,43,30,.12); }
    .kicker { font:700 12px/1.2 Verdana, sans-serif; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
    h1 { margin:20px 0 16px; font-size:clamp(48px,9vw,92px); line-height:.92; letter-spacing:-.07em; font-weight:500; }
    p { max-width:460px; margin:0; color:var(--muted); font:15px/1.7 Verdana, sans-serif; }
    .seal { margin-top:54px; width:92px; height:92px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; color:var(--accent); font:700 10px/1.2 Verdana, sans-serif; letter-spacing:.12em; text-transform:uppercase; transform:rotate(-8deg); }
  </style>
</head>
<body><main><div class="kicker">private address</div><h1>Reserved.</h1><p>No public content is available at this address. The site is intentionally left without a public page.</p><div class="seal">no index</div></main></body>
</html>
