<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quiet</title>
  <style>
    :root{--bg:#11100e;--ink:#fbf1dc;--muted:#a89e8d;--line:rgba(251,241,220,.16);--gold:#e8b44b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#11100e;color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}.sun{position:fixed;width:58vmin;height:58vmin;border-radius:50%;right:-12vmin;top:-10vmin;background:radial-gradient(circle at 40% 40%,#fff2ba,var(--gold) 44%,transparent 70%);opacity:.9}.grain{position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025),rgba(255,255,255,.025) 1px,transparent 1px,transparent 3px)}main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(26px,6vw,72px)}header{display:flex;justify-content:space-between;color:var(--muted);font:12px/1.2 Verdana,sans-serif;text-transform:uppercase;letter-spacing:.16em}.hero{max-width:820px;margin-top:18vh}h1{font-size:clamp(52px,11vw,132px);line-height:.82;letter-spacing:-.08em;margin:0 0 24px;font-weight:400}p{max-width:520px;color:var(--muted);font:16px/1.7 Verdana,sans-serif}.line{height:1px;background:var(--line);margin-top:54px;width:min(520px,70vw)}footer{color:var(--muted);font:12px/1.5 Verdana,sans-serif}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.04)}
  </style>
</head>
<body><div class="sun"></div><div class="grain"></div><main><header><span>quiet domain</span><span>no public index</span></header><section class="hero"><h1>Reserved for later.</h1><p>There is no public website here. This address is intentionally quiet.</p><div class="line"></div></section><footer><span class="badge">nothing to see here</span></footer></main></body>
</html>
